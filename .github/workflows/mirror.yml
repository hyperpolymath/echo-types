name: Mirror to Git Forges

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  mirror:
    uses: metadatastician/standards/.github/workflows/mirror-reusable.yml@75bd5994470661a099df562d6d5ad2fe744dbd66
    # Explicit secrets map, not `secrets: inherit` (Hypatia WH008): the callee
    # (standards@75bd5994) declares exactly these seven, all optional.
    secrets:
      GITLAB_SSH_KEY: ${{ secrets.GITLAB_SSH_KEY }}
      BITBUCKET_SSH_KEY: ${{ secrets.BITBUCKET_SSH_KEY }}
      CODEBERG_SSH_KEY: ${{ secrets.CODEBERG_SSH_KEY }}
      SOURCEHUT_SSH_KEY: ${{ secrets.SOURCEHUT_SSH_KEY }}
      DISROOT_SSH_KEY: ${{ secrets.DISROOT_SSH_KEY }}
      GITEA_SSH_KEY: ${{ secrets.GITEA_SSH_KEY }}
      RADICLE_KEY: ${{ secrets.RADICLE_KEY }}
