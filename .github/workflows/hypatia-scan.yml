# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
#
# Self-contained Hypatia neurosymbolic security scan + SARIF upload (`category:
# hypatia`) satisfying the `Hypatia` code-scanning tool requirement in the
# `Base` branch ruleset on `main`, as well as push, weekly schedule, and manual
# dispatch runs.
name: Hypatia Security Scan

on:
  pull_request:
  push:
    branches: [main, master, develop]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fleet:
    permissions:
      contents: read
    uses: hyperpolymath/gitbot-fleet/.github/workflows/fleet-report-back-reusable.yml@46d26a4b084c40847d9a2f2ef98305502b7320bc
    with:
      enrolment: .gitbot-fleet/enrolment.json
      artifact-name: fleet-report-backs

  hypatia:
    name: Hypatia Neurosymbolic Analysis
    needs: fleet
    # The security scan still runs if the producer fails. Missing report-backs
    # remain visible as unavailable evidence in the rendered fleet rows.
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read # Download this run's fleet report-back artifact.
      contents: read
      security-events: write
      vulnerability-alerts: read # Dependabot alerts, for Hypatia's DA rules
    env:
      HYPATIA_SHA: '7c10e5d712af7178f8c175e10a21c5216216c198'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          # Scan the same PR head checked out by the fleet producer.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Elixir 1.19.4 / OTP 28.3 for Hypatia scanner
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.19.4'
          otp-version: '28.3'

      - name: Cache pinned Hypatia build
        id: cache-hypatia
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/hypatia
            ~/.hex
            ~/.mix
          key: hypatia-sarif-${{ runner.os }}-otp28-elx1194-${{ env.HYPATIA_SHA }}

      - name: Build pinned Hypatia scanner
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/hypatia/hypatia" ] || [ ! -x "$HOME/hypatia/hypatia-cli.sh" ]; then
            rm -rf "$HOME/hypatia"
            git init "$HOME/hypatia"
            git -C "$HOME/hypatia" remote add origin https://github.com/hyperpolymath/hypatia.git
            git -C "$HOME/hypatia" fetch --depth=1 origin "$HYPATIA_SHA"
            git -C "$HOME/hypatia" checkout --detach FETCH_HEAD
            (
              cd "$HOME/hypatia"
              mix local.hex --force
              mix local.rebar --force
              mix deps.get
              MIX_NO_PUBSUB=1 mix escript.build
            )
            chmod +x "$HOME/hypatia/hypatia" "$HOME/hypatia/hypatia-cli.sh"
          fi

      - name: Run Hypatia JSON and SARIF analysis
        id: scan
        env:
          # The API-backed rules (code-scanning, Dependabot, secret-scanning,
          # branch-protection, baseline-health) return no findings without a
          # token. Scoped to this step. The job token reaches code-scanning
          # (security-events) and Dependabot (vulnerability-alerts) alerts;
          # it cannot read secret-scanning alerts, which need an App or PAT.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HYPATIA_FORMAT=json "$HOME/hypatia/hypatia-cli.sh" scan . --exit-zero > hypatia-findings.json
          jq -e 'type == "array"' hypatia-findings.json >/dev/null

          HYPATIA_FORMAT=sarif "$HOME/hypatia/hypatia-cli.sh" scan . --exit-zero > hypatia.sarif
          jq -e '.runs | type == "array" and length > 0' hypatia.sarif >/dev/null

          CRITICAL="$(jq '[.[] | select(.severity == "critical")] | length' hypatia-findings.json)"
          HIGH="$(jq '[.[] | select(.severity == "high")] | length' hypatia-findings.json)"
          TOTAL="$(jq 'length' hypatia-findings.json)"
          {
            echo "critical=$CRITICAL"
            echo "high=$HIGH"
            echo "total=$TOTAL"
          } >> "$GITHUB_OUTPUT"

      - name: Upload Hypatia SARIF to GitHub Code Scanning
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: hypatia.sarif
          category: hypatia

      - name: Preserve scanner evidence
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hypatia-findings
          path: |
            hypatia-findings.json
            hypatia.sarif
          retention-days: 14

      - name: Fetch the pinned verdict-grid renderer
        if: always()
        env:
          STANDARDS_SHA: ba640e9a57f22608710ffecdca282074eac55a0b
        run: |
          set -euo pipefail
          standards="$RUNNER_TEMP/standards-grid"
          git init --quiet "$standards"
          git -C "$standards" remote add origin https://github.com/metadatastician/standards.git
          git -C "$standards" sparse-checkout init --no-cone
          git -C "$standards" sparse-checkout set scripts/verdict-grid.sh scripts/lib/verdict-grid.jq
          git -C "$standards" fetch --quiet --depth=1 origin "$STANDARDS_SHA"
          git -C "$standards" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$standards" rev-parse HEAD)" = "$STANDARDS_SHA"

      - name: Download this run's fleet report-backs
        if: always()
        # Canonical consumer behavior: a missing producer artifact leaves
        # enrolled rows orange. It never supplies checked-out JSON as evidence.
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fleet-report-backs
          path: ${{ runner.temp }}/fleet-report-backs

      - name: Render Hypatia and fleet evidence together
        if: always()
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || 'local' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fleet-report-backs"
          bash "$RUNNER_TEMP/standards-grid/scripts/verdict-grid.sh" render \
            --out "$RUNNER_TEMP/verdict-grid" \
            --hypatia hypatia-findings.json --hypatia-sarif hypatia.sarif \
            --report-backs "$RUNNER_TEMP/fleet-report-backs" \
            --enrolment .gitbot-fleet/enrolment.json \
            --hypatia-ref "$HYPATIA_SHA" \
            --sha "$HEAD_SHA" --run "$GITHUB_RUN_ID" \
            --url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --pr "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
          cat "$RUNNER_TEMP/verdict-grid/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve the rendered evidence grid
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hypatia-verdict-grid
          path: ${{ runner.temp }}/verdict-grid
          if-no-files-found: error
          retention-days: 14

      - name: Enforce zero critical Hypatia findings
        env:
          CRITICAL_COUNT: ${{ steps.scan.outputs.critical }}
          HIGH_COUNT: ${{ steps.scan.outputs.high }}
          TOTAL_COUNT: ${{ steps.scan.outputs.total }}
        run: |
          set -euo pipefail
          {
            echo "## Hypatia Neurosymbolic Scan"
            echo ""
            echo "- Critical: ${CRITICAL_COUNT}"
            echo "- High: ${HIGH_COUNT}"
            echo "- Total findings: ${TOTAL_COUNT}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$CRITICAL_COUNT" != "0" ]; then
            jq -c '.[] | select(.severity == "critical")' hypatia-findings.json
            echo "::error::Hypatia reported ${CRITICAL_COUNT} critical finding(s)"
            exit 1
          fi
