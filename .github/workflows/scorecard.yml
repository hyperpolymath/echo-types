name: Scorecards supply-chain security

on:
  branch_protection_rule:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  actions: read
  contents: read

jobs:
  analysis:
    # Manual refreshes measure the merged default branch. Keep the OIDC-bearing
    # publication job off manually selected feature branches.
    if: github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    # Caller-granted permissions per the scorecard-reusable contract
    # (its header documents: the caller MUST grant security-events:write
    # + id-token:write; contents:read lets it read the repo). Closes the
    # Hypatia `scorecard_wrapper_missing_job_permissions` finding.
    # actions: read is repeated here: this job-level block replaces the
    # workflow-level one, and the callee's job requests actions: read.
    # The callee declares no secrets, so no `secrets:` line.
    permissions:
      actions: read
      contents: read
      security-events: write
      id-token: write
    uses: metadatastician/standards/.github/workflows/scorecard-reusable.yml@ba640e9a57f22608710ffecdca282074eac55a0b
