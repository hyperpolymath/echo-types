# The Containerfile is the single build definition; no parallel unpinned layers.
# Podman builds are verified separately. This file declares launcher preferences,
# not evidence of a stapeln/vordr/svalinn run or of a signed published image.
[metadata]
name = "echo-types"
version = "0.1.0-alpha"
description = "Agda proof-source carrier; All checked by the pinned toolchain"
author = "Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"
license = "MPL-2.0"

[build]
containerfile = "Containerfile"
context = "."
runtime = "podman"

[security]
non-root = true
read-only-root = true
no-new-privileges = true
cap-drop = ["ALL"]
seccomp-profile = "default"
